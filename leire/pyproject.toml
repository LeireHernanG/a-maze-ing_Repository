[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generator package"
requires-python = ">=3.10"
dependencies = [
    "numpy"
]
authors = [
  {name = "Patricia and Leire"}
]

[tool.setuptools.packages.find]
where = ["."]